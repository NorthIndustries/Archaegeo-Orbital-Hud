name: Wrap and Release MyDU ArchHUD
on:
  push:
    branches: master
jobs:
  wrap-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          cd scripts && npm install

      - name: Static verify
        run: ./scripts/verify-mydu.sh

      - name: Detect Version Number
        if: github.ref == 'refs/heads/master'
        run: echo "VERSION_NUMBER=$( ./scripts/version-number-from-src.sh )" >> $GITHUB_ENV

      - name: Build MyDU ArchHUD artifacts
        if: github.ref == 'refs/heads/master'
        run: ./scripts/build-mydu.sh false

      - name: Create Release Notes
        if: github.ref == 'refs/heads/master'
        run: |
          cat ./scripts/ReleaseNotesTemplate.md > ReleaseNotes.md
          ./scripts/latest-changes.sh >> ReleaseNotes.md
          echo "" >> ReleaseNotes.md
          echo "North Industries MyDU: bundled server atlas (mydu_atlas.lua). See INSTALL-MYDU.md." >> ReleaseNotes.md

      - name: Create Release
        if: github.ref == 'refs/heads/master'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NUMBER }}
          name: MyDU ArchHUD v${{ env.VERSION_NUMBER }}
          body_path: ReleaseNotes.md
          files: |
            MyDU-ArchHUD.zip
            MyDU-ArchHUD.conf
            MyDU-ArchHUD-GFN.conf
